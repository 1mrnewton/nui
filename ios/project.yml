name: NuiCounter
options:
  bundleIdPrefix: dev.nui
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    # Automatic signing for device; simulator stays unsigned (next block).
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: FR82ZG29F6
    # Simulator needs no signing — keeps the embedded framework hassle-free.
    "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": "NO"
    "CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]": "NO"
targets:
  NuiCounter:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources/app
        type: folder
        buildPhase: resources
    dependencies:
      - framework: Frameworks/Python.xcframework
        embed: true
        codeSign: true
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: nui
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.nui.counter
        SWIFT_OBJC_BRIDGING_HEADER: Sources/PythonBridging.h
    preBuildScripts:
      - name: Sync logic core (counter.py)
        basedOnDependencyAnalysis: false
        script: |
          mkdir -p "$PROJECT_DIR/Resources/app"
          cp "$PROJECT_DIR/../logic/counter.py" "$PROJECT_DIR/Resources/app/counter.py"
    postCompileScripts:
      - name: Install Python stdlib
        basedOnDependencyAnalysis: false
        script: |
          "$PROJECT_DIR/scripts/install_python_stdlib.sh"
